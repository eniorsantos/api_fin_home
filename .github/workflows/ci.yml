name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Backend typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Frontend typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Backend lint
        working-directory: ./backend
        run: npm run lint

      - name: Frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5433/finance_test
          TEST_DATABASE_URL: postgresql://finance:finance@localhost:5433/finance_test
          BRAPI_TOKEN: test-token
          JWT_SECRET: test-secret
          REDIS_URL: redis://localhost:6379
        run: |
          npx prisma migrate deploy
          npm test

      - name: Frontend build
        working-directory: ./frontend
        run: npm run build

      - name: Backend build
        working-directory: ./backend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5433/finance_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          BRAPI_TOKEN: test-token
          PORT: 3333
        run: |
          npx prisma migrate deploy
          npm run dev &
          sleep 10

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e
